name: Mobile preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      native-compatibility:
        description: Also check upstream native Deno compatibility
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Select build scope
        id: scope
        run: node scripts/ci-scope.mjs
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node packages/runtime/scripts/check-release.mjs
      - name: Check engine algorithms
        run: node godotengine/webgpu_tests/driver_unit_tests/run_tests.mjs
      - name: Runtime unit tests
        run: node --test tests/*.test.mjs packages/runtime/*.test.mjs godot-explorer/godot/web/preview.test.mjs godot-explorer/web/tools/{scene-comms,scene-gameplay,pulse}.test.mjs
      - name: Audit browser dependencies offline
        run: bash scripts/audit-browser.sh
      - name: Audit browser JavaScript dependencies
        run: npm audit --prefix godot-explorer/web/tools --omit=dev --audit-level=high
  engine:
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      JOBS: 3
      SCONS_VERSION: '4.11.1'
      BUILD_PRIORITY: normal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Engine cache key
        id: engine
        run: |
          echo "revision=$(git rev-parse HEAD:godotengine)" >> "$GITHUB_OUTPUT"
          echo "emsdk=$(git rev-parse HEAD:emsdk)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: template
        with:
          path: godotengine/bin/godot.web.template_debug.wasm32.nothreads.dlink.zip
          key: mobile-template-webgpu-scons-${{ env.SCONS_VERSION }}-${{ steps.engine.outputs.revision }}-${{ steps.engine.outputs.emsdk }}-${{ hashFiles('build.sh', 'godot-explorer/web/emsdk-side-module-exports.patch') }}-v3
          # Web templates are portable; reuse the previous Linux key with identical inputs.
          restore-keys: ${{ env.SCONS_VERSION == '4.11.1' && format('mobile-template-Linux-X64-{0}-{1}-{2}-v2', steps.engine.outputs.revision, steps.engine.outputs.emsdk, hashFiles('build.sh', 'godot-explorer/web/emsdk-side-module-exports.patch')) || '' }}
      - uses: actions/setup-python@v6
        if: steps.template.outputs.cache-matched-key == ''
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-emsdk
        if: steps.template.outputs.cache-matched-key == ''
      - name: Build engine
        if: steps.template.outputs.cache-matched-key == ''
        run: |
          python -m pip install "scons==$SCONS_VERSION"
          ./build.sh engine
      - name: Save engine before downstream checks
        uses: actions/cache/save@v6
        if: steps.template.outputs.cache-hit != 'true'
        with:
          path: godotengine/bin/godot.web.template_debug.wasm32.nothreads.dlink.zip
          key: ${{ steps.template.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: engine-template
          path: godotengine/bin/godot.web.template_debug.wasm32.nothreads.dlink.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  runtime:
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      JOBS: 3
      BUILD_PRIORITY: normal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Rust
        run: |
          rustup toolchain install 1.90 --profile minimal
          rustup default 1.90
          rustup toolchain install nightly-2026-09-15 --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            godot-explorer -> target
            godot-explorer/lib -> target
          key: preview-macos-15-nightly-2026-09-15-${{ hashFiles('build.sh', 'godot-explorer/web/wasm-env.sh', 'godot-explorer/web/emsdk-side-module-exports.patch') }}
          cache-on-failure: true
          cache-bin: false
      - uses: ./.github/actions/setup-emsdk
      - name: Build native importer
        run: ./build.sh native
      - name: Build web extension
        run: ./build.sh wasm
      - name: Check gameplay and Pulse
        env:
          CHECK_NATIVE_COMPATIBILITY: ${{ inputs.native-compatibility || false }}
        run: bash scripts/check-native.sh
      - name: Archive export inputs
        run: |
          tar -czf "$RUNNER_TEMP/runtime-inputs.tar.gz" \
            godot-explorer/.bin/godot/godot4_bin \
            godot-explorer/godot/addons/sentry/bin/macos \
            godot-explorer/godot/addons/sentry/bin/web \
            godot-explorer/lib/target/libdclgodot_macos/libdclgodot.dylib \
            godot-explorer/lib/target/wasm32-unknown-emscripten/release/dclgodot.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-inputs
          path: ${{ runner.temp }}/runtime-inputs.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  build:
    needs: [engine, runtime]
    runs-on: macos-15
    timeout-minutes: 15
    env:
      BUILD_PRIORITY: normal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: engine-template
          path: godotengine/bin
      - uses: actions/download-artifact@v8
        with:
          name: runtime-inputs
          path: ${{ runner.temp }}
      - name: Restore export inputs
        run: tar -xzf "$RUNNER_TEMP/runtime-inputs.tar.gz"
      - name: Export preview
        run: ./build.sh preview
      - name: Export regression fixtures
        run: |
          ./build.sh test webgpu-frame-pacing
          ./build.sh test webgpu-texture-roundtrip
          ./build.sh test webgpu-buffer-coherence
      - name: Check content thread guards
        run: node --test godot-explorer/web/tools/thread-safety.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-preview-export
          path: godot-explorer/build/web/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: webgpu-regressions
          path: tests/*/build/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: export-logs
          path: |
            godot-explorer/build/*.log
            tests/*/build/export.log
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: webgpu-regressions
          path: tests
      - run: npm ci --prefix godot-explorer/web/tools
      - run: npx --prefix godot-explorer/web/tools playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Check WebGPU regressions
        run: |
          xvfb-run -a node godot-explorer/web/tools/run-web.mjs tests/webgpu-texture-roundtrip/build 90 texture.png --ci --headed --assert=textureRoundtripResult
          xvfb-run -a node godot-explorer/web/tools/run-web.mjs tests/webgpu-buffer-coherence/build 90 buffers.png --ci --headed --assert=bufferCoherenceResult
          xvfb-run -a node godot-explorer/web/tools/run-web.mjs tests/webgpu-frame-pacing/build 90 pacing.png --ci --headed --assert=framePacingResult
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-screenshots
          path: '*.png'
  package:
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: mobile-preview-export
          path: runtime-export
      - run: npm test --prefix packages/runtime
      - run: npm run build --prefix packages/runtime -- "$GITHUB_WORKSPACE/runtime-export"
      - run: npm pack ./packages/runtime
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-preview-npm
          path: dcl-regenesislabs-mobile-preview-runtime-*.tgz
          if-no-files-found: error
          retention-days: 14
  validate:
    if: always() && github.event.action != 'closed'
    needs: [checks, engine, runtime, build, browser, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILD_SCOPE: ${{ needs.checks.outputs.build }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$CHECKS" = success
          case "$BUILD_SCOPE" in true|false) ;; *) exit 1 ;; esac
          for result in $RESULTS; do
            if [ "$BUILD_SCOPE" = true ]; then
              test "$result" = success
            else
              case "$result" in success|skipped) ;; *) exit 1 ;; esac
            fi
          done
  publish:
    if: github.repository == 'dcl-regenesislabs/godot-web-preview' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [package, validate]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: packages/runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@v8
        with:
          name: mobile-preview-npm
          path: release
      - name: Verify the built package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node packages/runtime/scripts/check-release.mjs
          tar -xzf release/dcl-regenesislabs-mobile-preview-runtime-*.tgz -C release
          node release/package/scripts/check-dist.mjs
      - name: Publish with Oddish
        uses: decentraland/oddish-action@a4e98664bf53d4aae1f6d20d1a43ff2c79b555b3 # v1
        with:
          cwd: ./release/package
          registry-url: https://registry.npmjs.org
          access: public
          provenance: true
